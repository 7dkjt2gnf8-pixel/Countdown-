<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="format-detection" content="telephone=no, date=no, address=no, email=no, url=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Countdown+</title>
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#3D7DEA">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Countdown+">
<style>
  :root{
    --bg: #1B2C4F;
    --surface: #24396A;
    --border: #3A537F;
    --text: #EDF0F7;
    --text-muted: #8A94B3;
    --accent: #3D7DEA;
    --accent-dark: #2E63BD;
    --danger: #EF6B5D;
    --radius: 22px;
  }
  *{box-sizing:border-box;}
  html{
    touch-action:manipulation;
    -webkit-text-size-adjust:100%;
    text-size-adjust:100%;
    background:var(--bg);
    height:100%;
    overscroll-behavior-y:none;
  }
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Aptos', 'Aptos Display', system-ui, -apple-system, 'Segoe UI', sans-serif;
    min-height:100%;
    -webkit-font-smoothing:antialiased;
    touch-action:manipulation;
    -webkit-user-select:none;
    user-select:none;
    -webkit-touch-callout:none;
    -webkit-tap-highlight-color:transparent;
    overscroll-behavior-y:none;
  }
  /* Les champs de saisie restent normalement sélectionnables/éditables */
  input, textarea{
    -webkit-user-select:text;
    user-select:text;
    -webkit-touch-callout:default;
  }
  #app{
    position:relative;
    max-width:640px;
    margin:0 auto;
    padding:calc(28px + env(safe-area-inset-top, 0px)) 16px 90px;
    background:var(--bg);
    min-height:100vh;
    min-height:100dvh;
  }
  header{
    margin-bottom:22px;
    margin-top:8px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
  }
  header h1{
    font-family:'Aptos Display', 'Aptos', system-ui, sans-serif;
    font-weight:800;
    font-size:28px;
    letter-spacing:-0.01em;
    margin:0;
    color:var(--text);
  }
  header .eyebrow{
    font-size:13px;
    font-weight:600;
    letter-spacing:.04em;
    text-transform:uppercase;
    color:var(--text-muted);
  }
  .header-actions{
    flex-shrink:0;
    display:flex;
    gap:10px;
  }
  .settings-btn{
    flex-shrink:0;
    width:42px;
    height:42px;
    border-radius:13px;
    border:none;
    background:var(--surface);
    color:var(--text);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
  }
  .settings-btn:hover{background:var(--border);}
  .settings-btn.empty-hint{
    animation:emptyHintPulse 1.5s ease-in-out infinite;
  }
  @keyframes emptyHintPulse{
    0%, 100%{ box-shadow:0 0 0 0 rgba(255,59,48,.6); }
    50%{ box-shadow:0 0 0 9px rgba(255,59,48,0); }
  }
  .empty-arrow{
    position:absolute;
    top:calc(82px + env(safe-area-inset-top, 0px));
    right:78px;
    width:44px;
    height:52px;
    color:#FF3B30;
    pointer-events:none;
    animation:emptyArrowBounce 1.5s ease-in-out infinite;
  }
  .empty-arrow svg{display:block; width:100%; height:100%;}
  @keyframes emptyArrowBounce{
    0%, 100%{ transform:translateY(0); opacity:.85; }
    50%{ transform:translateY(5px); opacity:1; }
  }

  /* ---- Form panel ---- */
  .form-panel{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:20px;
    box-shadow:0 12px 30px rgba(0,0,0,.25);
    width:100%;
    max-width:420px;
    box-sizing:border-box;
    max-height:calc(100vh - 92px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
    max-height:calc(100dvh - 92px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
    overflow-x:hidden;
    overflow-y:auto;
    overscroll-behavior:contain;
    -webkit-overflow-scrolling:touch;
  }
  .segmented{
    display:inline-flex;
    background:var(--bg);
    border-radius:14px;
    padding:4px;
    margin-bottom:16px;
    width:100%;
  }
  .segmented button{
    flex:1;
    font-size:14px;
    font-weight:700;
    background:transparent;
    border:none;
    color:var(--text-muted);
    padding:10px 14px;
    border-radius:11px;
    cursor:pointer;
    transition:background .15s ease, color .15s ease;
    font-family:inherit;
  }
  .segmented button.active{
    background:var(--accent);
    color:#fff;
  }
  .field-row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    margin-bottom:12px;
  }
  .field-row.single{grid-template-columns:1fr;}
  .field{display:flex;flex-direction:column;gap:6px;}
  .field label{
    font-size:12.5px;
    font-weight:600;
    color:var(--text-muted);
  }
  .field input{
    background:var(--bg);
    border:1.5px solid transparent;
    border-radius:12px;
    color:var(--text);
    padding:11px 13px;
    font-family:inherit;
    font-size:15px;
    font-weight:600;
  }
  .field input:focus{
    outline:none;
    border-color:var(--accent);
    background:var(--surface);
  }
  .field input.invalid{
    border-color:var(--danger);
    background:var(--surface);
  }
  .date-input-wrap{
    position:relative;
    display:flex;
    align-items:center;
    gap:6px;
  }
  .date-input-wrap input[type="text"]{
    flex:1;
    min-width:0;
  }
  .calendar-btn-wrap{
    position:relative;
    flex-shrink:0;
    width:40px;
    height:40px;
  }
  .calendar-btn{
    position:absolute;
    inset:0;
    background:var(--bg);
    border:none;
    border-radius:12px;
    font-size:17px;
    display:flex;
    align-items:center;
    justify-content:center;
    pointer-events:none;
  }
  .native-picker-overlay{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    opacity:0;
    border:0;
    padding:0;
    margin:0;
    cursor:pointer;
  }
  .credit-fields{display:none;}
  .credit-fields.visible{display:contents;}
  .color-swatches{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
  }
  .color-swatch{
    width:36px;
    height:36px;
    border-radius:50%;
    border:none;
    cursor:pointer;
    box-shadow:inset 0 0 0 2px rgba(255,255,255,.5);
    position:relative;
  }
  .color-swatch.selected::after{
    content:'✓';
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#fff;
    font-size:16px;
    font-weight:800;
  }
  .color-swatch.selected{
    box-shadow:0 0 0 3px #fff, 0 0 0 5px var(--accent);
  }
  .icon-swatches{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
  }
  .icon-swatch{
    width:42px;
    height:42px;
    border-radius:13px;
    border:none;
    background:var(--bg);
    font-size:20px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
  }
  .icon-swatch.selected{
    background:var(--accent);
    color:#fff;
    box-shadow:0 0 0 2px var(--accent-dark) inset;
  }
  button.primary{
    width:100%;
    font-family:inherit;
    font-size:16px;
    background:var(--accent);
    color:#fff;
    border:none;
    padding:15px 20px;
    border-radius:18px;
    cursor:pointer;
    font-weight:800;
    box-shadow:0 4px 14px rgba(61,125,234,.35);
  }
  button.primary:hover{background:var(--accent-dark);}
  .submit-row{
    margin-top:6px;
    display:flex;
    gap:10px;
  }
  .submit-row button.primary{flex:2;}
  button.secondary{
    flex:1;
    font-family:inherit;
    font-size:16px;
    background:var(--bg);
    color:var(--text-muted);
    border:none;
    padding:15px 20px;
    border-radius:18px;
    cursor:pointer;
    font-weight:700;
  }
  button.secondary:hover{background:var(--border);}
  .form-error{
    color:var(--danger);
    font-size:13px;
    font-weight:600;
    margin-top:8px;
    display:none;
  }

  /* ---- Bloc total des crédits ---- */
  .total-card{
    background:#FFFFFF;
    color:#1C1C1E;
    border:1px solid #E5E5EA;
    border-radius:var(--radius);
    padding:18px 18px 16px;
    margin-bottom:16px;
    box-shadow:0 2px 10px rgba(0,0,0,.06);
  }
  .total-header{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:10px;
    color:#8A8A8E;
  }
  .total-icon{display:flex; flex-shrink:0;}
  .total-label{
    font-size:12.5px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.04em;
  }
  .total-filter-btn{
    margin-left:auto;
    width:26px;
    height:26px;
    border-radius:8px;
    border:none;
    background:#F2F2F7;
    color:#8A8A8E;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
  }
  .total-filter-btn.active{background:#007AFF; color:#fff;}
  .total-money-row{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:8px;
    margin-bottom:6px;
  }
  .total-amount{
    font-size:26px;
    font-weight:800;
    letter-spacing:-0.01em;
    font-variant-numeric:tabular-nums;
    color:#1C1C1E;
  }
  .total-card .progress-track{background:#E5E5EA;}
  .total-card .progress-fill{background:#007AFF;}
  .total-monthly{
    font-size:13px;
    font-weight:600;
    color:#636366;
    margin-top:8px;
  }
  .total-chart{margin-top:12px; color:#007AFF;}
  .total-chart svg{display:block; width:100%; height:72px;}
  .total-chart-dates{
    position:relative;
    height:14px;
    margin-top:2px;
    transition:height .15s ease;
  }
  .total-chart-dates span{
    position:absolute;
    top:0;
    transform:translateX(-50%);
    font-size:9.5px;
    font-weight:700;
    color:#8A8A8E;
    white-space:nowrap;
    font-variant-numeric:tabular-nums;
  }

  /* ---- Cards ---- */
  .cards-grid{
    display:flex;
    flex-direction:column;
    gap:14px;
  }
  .card{
    position:relative;
    border-radius:var(--radius);
    overflow:hidden;
    color:#fff;
    box-shadow:0 4px 14px rgba(30,30,60,.10);
    -webkit-user-select:none;
    user-select:none;
    -webkit-touch-callout:none;
    transition:box-shadow .15s ease, transform .18s ease;
  }
  .card.selected{
    box-shadow:0 0 0 3px #fff, 0 0 0 6px var(--accent), 0 10px 22px rgba(30,30,60,.28);
  }
  .card.lift-armed{
    transform:scale(1.04);
    box-shadow:0 12px 26px rgba(0,0,0,.32);
    z-index:20;
  }
  .card.dragging{
    transition:box-shadow .15s ease;
    box-shadow:0 16px 32px rgba(0,0,0,.4);
    z-index:50;
  }

  .card-actions{
    position:absolute;
    top:10px;
    right:10px;
    display:flex;
    gap:8px;
    opacity:0;
    transform:translateY(-4px);
    pointer-events:none;
    transition:opacity .15s ease, transform .15s ease;
    z-index:2;
  }
  .card.selected .card-actions{
    opacity:1;
    transform:translateY(0);
    pointer-events:auto;
  }
  .card-action-btn{
    width:34px;
    height:34px;
    border-radius:50%;
    border:none;
    background:rgba(255,255,255,.95);
    display:flex;
    align-items:center;
    justify-content:center;
    color:#2A2A33;
    box-shadow:0 2px 6px rgba(0,0,0,.3);
    cursor:pointer;
  }
  .card-action-btn.delete-action{background:#fff;}

  .confirm-backdrop{
    position:fixed;
    inset:0;
    background:rgba(20,20,30,.45);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:60;
    padding:24px;
    padding-top:calc(44px + env(safe-area-inset-top, 0px));
    padding-bottom:calc(24px + env(safe-area-inset-bottom, 0px));
  }
  .confirm-box{
    background:var(--surface);
    border-radius:20px;
    padding:22px;
    max-width:340px;
    width:100%;
    box-shadow:0 12px 30px rgba(0,0,0,.25);
  }
  .confirm-text{
    font-size:15px;
    font-weight:700;
    color:var(--text);
    margin:0 0 18px;
    text-align:center;
    line-height:1.4;
  }
  .confirm-actions{display:flex;gap:10px;}
  .confirm-actions button{
    flex:1;
    padding:13px;
    border-radius:14px;
    border:none;
    font-family:inherit;
    font-weight:700;
    font-size:15px;
    cursor:pointer;
  }
  .confirm-cancel-btn{background:var(--bg); color:var(--text-muted);}
  .confirm-danger-btn{background:var(--danger); color:#fff;}

  .settings-box{max-width:360px; text-align:left;}
  .settings-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:18px;
  }
  .settings-title{
    font-size:17px;
    font-weight:800;
    margin:0;
    color:var(--text);
  }
  .settings-close-btn{
    width:30px;
    height:30px;
    border-radius:50%;
    border:none;
    background:var(--bg);
    color:var(--text-muted);
    font-size:14px;
    cursor:pointer;
  }
  .settings-row{margin-bottom:16px;}
  .settings-row:last-child{margin-bottom:0;}
  .settings-label{
    display:block;
    font-size:12.5px;
    font-weight:600;
    color:var(--text-muted);
    margin-bottom:8px;
  }
  #langSegmented, #styleSegmented{width:100%;}
  #langSegmented button, #styleSegmented button{
    flex:1;
    font-family:inherit;
    font-size:13.5px;
    font-weight:700;
    background:transparent;
    border:none;
    color:var(--text-muted);
    padding:10px 10px;
    border-radius:11px;
    cursor:pointer;
  }
  #langSegmented button.active, #styleSegmented button.active{
    background:var(--accent);
    color:#fff;
  }
  .sort-options{display:flex; flex-direction:column;}
  .sort-option{
    display:flex;
    align-items:center;
    justify-content:space-between;
    width:100%;
    background:transparent;
    border:none;
    border-top:1px solid var(--border);
    padding:14px 2px;
    font-family:inherit;
    font-size:15px;
    font-weight:600;
    color:var(--text);
    cursor:pointer;
    text-align:left;
  }
  .sort-option:first-child{border-top:none;}
  .sort-option .sort-check{
    color:var(--accent);
    opacity:0;
    display:flex;
  }
  .sort-option.active .sort-check{opacity:1;}

  /* ---- Thème alternatif "iOS" : clair et sobre, façon réglages système ---- */
  #app.style-ios{
    --bg: #F2F2F7;
    --surface: #FFFFFF;
    --border: #E5E5EA;
    --text: #1C1C1E;
    --text-muted: #8A8A8E;
    --accent: #007AFF;
    --accent-dark: #0060DF;
    --danger: #FF3B30;
    background:var(--bg);
  }
  /* Les vignettes passent en lignes blanches sobres (la couleur choisie ne teinte plus que l'icône) */
  #app.style-ios .card{
    background:var(--surface) !important;
    color:var(--text) !important;
    box-shadow:0 0 0 1.5px var(--card-color, var(--accent)) !important;
    border:1px solid var(--border);
  }
  #app.style-ios .card-number,
  #app.style-ios .card-money{
    background:#F7F7FA !important;
  }
  #app.style-ios .card-number{border-left:1px solid var(--border);}
  #app.style-ios .card-money{border-top:1px solid var(--border);}
  #app.style-ios .icon-badge{background:rgba(0,0,0,.06) !important;}
  #app.style-ios .progress-track{background:#E5E5EA !important;}
  #app.style-ios .progress-fill{background:var(--accent) !important;}
  #app.style-ios .status-pill{background:#E5E5EA !important; color:var(--text) !important;}
  #app.style-ios .card-action-btn{
    background:#fff !important;
    box-shadow:0 1px 3px rgba(0,0,0,.18), 0 0 0 1.5px var(--card-color, var(--accent));
  }
  /* Sélections en style "contour", comme les segments FR/EN de la référence */
  #app.style-ios .segmented button.active,
  #app.style-ios #langSegmented button.active,
  #app.style-ios #styleSegmented button.active{
    background:#fff !important;
    color:var(--accent) !important;
    box-shadow:0 0 0 1.5px var(--accent) inset;
  }
  #app.style-ios .color-swatch.selected{
    box-shadow:0 0 0 3px #fff, 0 0 0 5px var(--accent) !important;
  }
  #app.style-ios .icon-swatch.selected{
    background:#fff !important;
    color:var(--accent) !important;
    box-shadow:0 0 0 1.5px var(--accent) inset;
  }
  #app.style-ios .card.selected{
    box-shadow:0 0 0 2px var(--accent) !important;
  }
  .card-main{
    display:flex;
    align-items:center;
    gap:14px;
    padding:16px 16px;
    min-width:0;
  }
  .icon-badge{
    width:52px;
    height:52px;
    border-radius:16px;
    background:rgba(255,255,255,.85);
    color:var(--card-color, #333);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:26px;
    flex-shrink:0;
  }
  .card-text{flex:1; min-width:0;}
  .card-title{
    font-size:19px;
    font-weight:800;
    margin:0 0 2px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .card-sub{
    font-size:13px;
    font-weight:600;
    opacity:.85;
  }
  .card-number{
    background:rgba(0,0,0,.16);
    padding:10px 10px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
    width:92px;
    box-sizing:border-box;
  }
  .number-value{
    font-size:26px;
    font-weight:800;
    line-height:1;
    font-variant-numeric:tabular-nums;
    white-space:nowrap;
  }
  .number-label{
    font-size:11px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.04em;
    opacity:.85;
  }
  .number-sub{
    font-size:10.5px;
    font-weight:600;
    opacity:.75;
    margin-top:2px;
    font-variant-numeric:tabular-nums;
  }
  .card-number{cursor:pointer;}
  .number-ymd{
    display:none;
    font-size:11px;
    font-weight:700;
    line-height:1.5;
    text-align:center;
    white-space:nowrap;
  }
  .card-number.mode-ymd .number-value,
  .card-number.mode-ymd .number-label,
  .card-number.mode-ymd .number-sub{
    display:none;
  }
  .card-number.mode-ymd .number-ymd{
    display:block;
  }
  .card-row{
    display:flex;
    align-items:stretch;
  }
  .delete-btn{
    background:transparent;
    border:none;
    color:#fff;
    opacity:.55;
    padding:4px;
    cursor:pointer;
    display:flex;
    align-items:center;
    flex-shrink:0;
    align-self:flex-start;
    margin-left:4px;
  }
  .delete-btn:hover{opacity:1;}

  .card-money{
    background:rgba(0,0,0,.12);
    padding:12px 18px 14px;
  }
  .money-line{
    font-size:21px;
    font-weight:800;
    letter-spacing:-0.01em;
    font-variant-numeric:tabular-nums;
  }
  .money-caption{
    font-size:12px;
    font-weight:600;
    opacity:.85;
  }
  .repaid-today{
    font-size:13px;
    font-weight:700;
    margin-bottom:6px;
    font-variant-numeric:tabular-nums;
    opacity:.95;
  }
  .repaid-month{
    font-size:13px;
    font-weight:700;
    margin-bottom:6px;
    font-variant-numeric:tabular-nums;
    opacity:.95;
  }
  .interest-month{
    font-size:13px;
    font-weight:700;
    margin-bottom:6px;
    font-variant-numeric:tabular-nums;
    opacity:.95;
  }
  .money-row{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:8px;
    margin-bottom:6px;
  }
  .progress-percent{
    font-size:12px;
    font-weight:700;
    letter-spacing:.03em;
    opacity:.65;
    font-variant-numeric:tabular-nums;
    white-space:nowrap;
  }
  .progress-track{
    height:6px;
    background:rgba(255,255,255,.25);
    border-radius:4px;
    overflow:hidden;
    margin-bottom:8px;
  }
  .progress-fill{
    height:100%;
    background:#fff;
    border-radius:4px;
    transition:width .3s ease;
  }
  .status-pill{
    display:inline-block;
    font-size:11px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.04em;
    padding:4px 10px;
    border-radius:20px;
    background:rgba(255,255,255,.22);
  }

  @media (max-width:420px){
    .field-row{grid-template-columns:1fr;}
    .icon-badge{width:44px;height:44px;font-size:22px;border-radius:13px;}
    .number-value{font-size:21px;}
    .card-number{width:80px;}
    .card-title{font-size:17px;}
  }

  .archive-banner{
    margin-top:16px;
    border:1px solid var(--border);
    border-radius:16px;
    overflow:hidden;
    background:var(--surface);
  }
  .archive-banner-toggle{
    width:100%;
    display:flex;
    align-items:center;
    gap:8px;
    background:transparent;
    border:none;
    padding:13px 16px;
    font-family:inherit;
    font-size:13.5px;
    font-weight:700;
    color:var(--text-muted);
    cursor:pointer;
  }
  .archive-count{
    background:var(--bg);
    color:var(--text-muted);
    font-size:11.5px;
    font-weight:700;
    padding:2px 8px;
    border-radius:20px;
  }
  .archive-chevron{
    margin-left:auto;
    flex-shrink:0;
    transition:transform .2s ease;
  }
  .archive-banner.open .archive-chevron{transform:rotate(180deg);}
  .archive-list{
    border-top:1px solid var(--border);
    display:flex;
    flex-direction:column;
  }
  .archive-item{
    display:flex;
    align-items:center;
    gap:10px;
    padding:10px 14px;
    border-bottom:1px solid var(--border);
  }
  .archive-item:last-child{border-bottom:none;}
  .archive-item-icon{
    width:32px;
    height:32px;
    border-radius:10px;
    background:var(--bg);
    color:var(--text-muted);
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
  }
  .archive-item-text{flex:1; min-width:0;}
  .archive-item-title{
    font-size:13.5px;
    font-weight:700;
    color:var(--text);
    margin:0;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .archive-item-sub{
    font-size:11.5px;
    font-weight:600;
    color:var(--text-muted);
  }
  .archive-item-actions{
    display:flex;
    gap:6px;
    flex-shrink:0;
  }
  .archive-item-btn{
    width:30px;
    height:30px;
    border-radius:9px;
    border:none;
    background:var(--bg);
    color:var(--text-muted);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
  }
  .archive-item-btn.danger{color:var(--danger);}

  .app-footer{
    text-align:center;
    margin-top:32px;
    font-size:12px;
    font-weight:600;
    color:var(--text-muted);
    letter-spacing:.02em;
  }
  .app-version{
    position:fixed;
    bottom:calc(6px + env(safe-area-inset-bottom, 0px));
    right:10px;
    font-size:9px;
    font-weight:600;
    color:var(--text-muted);
    opacity:.5;
    pointer-events:none;
    z-index:5;
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Countdown+</h1>
    <div class="header-actions">
      <button type="button" id="toggleFormBtn" class="settings-btn" aria-label="Nouveau compte à rebours">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" width="22" height="22"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
      </button>
      <button type="button" id="sortBtn" class="settings-btn" aria-label="Trier">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="21" height="21"><path d="m3 16 4 4 4-4"></path><path d="M7 20V4"></path><path d="m21 8-4-4-4 4"></path><path d="M17 4v16"></path></svg>
      </button>
      <button type="button" id="settingsBtn" class="settings-btn" aria-label="Réglages">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="21" height="21"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
      </button>
    </div>
  </header>

  <div class="empty-arrow" id="emptyArrow" style="display:none;">
    <svg viewBox="0 0 60 70" xmlns="http://www.w3.org/2000/svg">
      <line x1="50" y1="64" x2="22" y2="24" stroke="currentColor" stroke-width="9" stroke-linecap="round"/>
      <polygon points="6,4 32,17 13,32" fill="currentColor"/>
    </svg>
  </div>

  <div class="total-card" id="totalCard" style="display:none;">
    <div class="total-header">
      <div class="total-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><path d="M3 3v18h18"></path><path d="m19 9-5 5-4-4-3 3"></path></svg>
      </div>
      <span class="total-label" data-i18n="total_label">Total des crédits</span>
      <button type="button" class="total-filter-btn" id="totalFilterBtn" aria-label="Filtrer">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="15" height="15"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon></svg>
      </button>
    </div>
    <div class="total-money-row">
      <div class="total-amount" data-total-amount>— €</div>
    </div>
    <div class="progress-track"><div class="progress-fill" data-total-progress></div></div>
    <div class="total-monthly" data-total-monthly></div>
    <div class="total-chart" id="totalChart"></div>
    <div class="total-chart-dates" id="totalChartDates"></div>
  </div>

  <div class="cards-grid" id="cardsGrid"></div>

  <div class="archive-banner" id="archiveBanner" style="display:none;">
    <button type="button" class="archive-banner-toggle" id="archiveBannerToggle">
      <span data-i18n="archived_label">Archivés</span>
      <span class="archive-count" id="archiveCount"></span>
      <svg class="archive-chevron" id="archiveChevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><polyline points="6 9 12 15 18 9"></polyline></svg>
    </button>
    <div class="archive-list" id="archiveList" style="display:none;"></div>
  </div>

  <div class="confirm-backdrop" id="formBackdrop" style="display:none;">
  <div class="form-panel" id="formPanel">
    <div class="segmented">
      <button type="button" id="tabSimple" class="active" data-i18n="tab_simple">Échéance</button>
      <button type="button" id="tabCredit" data-i18n="tab_credit">Crédit immobilier</button>
    </div>

    <form id="addForm">
      <div class="field-row single">
        <div class="field">
          <label for="titleInput" data-i18n="label_title">Titre</label>
          <input type="text" id="titleInput" placeholder="Ex. Départ en vacances" maxlength="28" required>
        </div>
      </div>

      <div class="field-row single">
        <div class="field">
          <label data-i18n="label_color">Couleur de la vignette</label>
          <div class="color-swatches" id="colorSwatches"></div>
        </div>
      </div>

      <div class="field-row single">
        <div class="field">
          <label data-i18n="label_icon">Icône</label>
          <div class="icon-swatches" id="iconSwatches"></div>
        </div>
      </div>

      <div class="field-row" id="simpleFields">
        <div class="field">
          <label for="endDateOnlyText" data-i18n="label_end_date">Date de fin</label>
          <div class="date-input-wrap">
            <input type="text" id="endDateOnlyText" placeholder="JJ/MM/AAAA" inputmode="numeric" autocomplete="off">
            <div class="calendar-btn-wrap">
              <button type="button" class="calendar-btn" tabindex="-1" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18"><rect x="3" y="4" width="18" height="18" rx="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg></button>
              <input type="date" id="endDateOnlyHidden" class="native-picker-overlay" aria-label="Choisir dans le calendrier">
            </div>
          </div>
        </div>
        <div class="field">
          <label for="endTimeText" data-i18n="label_end_time">Heure de fin</label>
          <div class="date-input-wrap">
            <input type="text" id="endTimeText" placeholder="HH:MM" inputmode="numeric" autocomplete="off">
            <div class="calendar-btn-wrap">
              <button type="button" class="calendar-btn" tabindex="-1" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18"><circle cx="12" cy="12" r="9"></circle><polyline points="12 7 12 12 15.5 14"></polyline></svg></button>
              <input type="time" id="endTimeHidden" class="native-picker-overlay" aria-label="Choisir l'heure">
            </div>
          </div>
        </div>
      </div>

      <div class="field-row credit-fields" id="creditFields">
        <div class="field">
          <label for="amountInput" data-i18n="label_amount">Montant emprunté (€)</label>
          <input type="number" id="amountInput" min="0" step="0.01" inputmode="decimal" placeholder="250000">
        </div>
        <div class="field">
          <label for="initialAmountInput" data-i18n="label_initial_amount">Montant initial (€) — facultatif, si différent (renégociation)</label>
          <input type="number" id="initialAmountInput" min="0" step="0.01" inputmode="decimal" placeholder="Optionnel">
        </div>
        <div class="field" id="initialDateField" style="display:none;">
          <label for="initialDateText" data-i18n="label_initial_date">Date du montant initial</label>
          <div class="date-input-wrap">
            <input type="text" id="initialDateText" placeholder="JJ/MM/AAAA" inputmode="numeric" autocomplete="off">
            <div class="calendar-btn-wrap">
              <button type="button" class="calendar-btn" tabindex="-1" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18"><rect x="3" y="4" width="18" height="18" rx="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg></button>
              <input type="date" id="initialDateHidden" class="native-picker-overlay" aria-label="Choisir dans le calendrier">
            </div>
          </div>
        </div>
        <div class="field">
          <label for="rateInput" data-i18n="label_rate">Taux annuel (%)</label>
          <input type="number" id="rateInput" min="0" step="0.01" inputmode="decimal" placeholder="3.5">
        </div>
        <div class="field">
          <label for="insuranceInput" data-i18n="label_insurance">Assurance mensuelle (€) — facultatif</label>
          <input type="number" id="insuranceInput" min="0" step="0.01" inputmode="decimal" placeholder="Optionnel">
        </div>
        <div class="field">
          <label for="startDateText" data-i18n="label_start_date">Date de départ</label>
          <div class="date-input-wrap">
            <input type="text" id="startDateText" placeholder="JJ/MM/AAAA" inputmode="numeric" autocomplete="off">
            <div class="calendar-btn-wrap">
              <button type="button" class="calendar-btn" tabindex="-1" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18"><rect x="3" y="4" width="18" height="18" rx="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg></button>
              <input type="date" id="startDateHidden" class="native-picker-overlay" aria-label="Choisir dans le calendrier">
            </div>
          </div>
        </div>
        <div class="field">
          <label for="creditEndDateText" data-i18n="label_end_date">Date de fin</label>
          <div class="date-input-wrap">
            <input type="text" id="creditEndDateText" placeholder="JJ/MM/AAAA" inputmode="numeric" autocomplete="off">
            <div class="calendar-btn-wrap">
              <button type="button" class="calendar-btn" tabindex="-1" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18"><rect x="3" y="4" width="18" height="18" rx="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg></button>
              <input type="date" id="creditEndDateHidden" class="native-picker-overlay" aria-label="Choisir dans le calendrier">
            </div>
          </div>
        </div>
      </div>

      <div class="form-error" id="formError">Merci de compléter les champs requis.</div>

      <div class="submit-row">
        <button type="button" id="cancelFormBtn" class="secondary" data-i18n="btn_cancel">Annuler</button>
        <button type="submit" class="primary" data-i18n="btn_add">Ajouter</button>
      </div>
    </form>
  </div>
  </div>

  <footer class="app-footer" id="footerText" data-i18n="footer">Designed by Mienos</footer>
  <!-- APP_VERSION: incrémenter (v1.9 -> v1.9 -> ...) à chaque modification du fichier -->
  <div class="app-version">v1.9</div>

  <div class="confirm-backdrop" id="settingsBackdrop" style="display:none;">
    <div class="confirm-box settings-box">
      <div class="settings-header">
        <p class="settings-title" data-i18n="settings_title">Réglages</p>
        <button type="button" id="settingsCloseBtn" class="settings-close-btn" aria-label="Fermer">✕</button>
      </div>

      <div class="settings-row">
        <label class="settings-label" data-i18n="settings_lang">Langue</label>
        <div class="segmented" id="langSegmented">
          <button type="button" data-lang="fr">FR</button>
          <button type="button" data-lang="en">EN</button>
        </div>
      </div>

      <div class="settings-row">
        <label class="settings-label" data-i18n="settings_style">Style d'affichage</label>
        <div class="segmented" id="styleSegmented">
          <button type="button" data-style="color" data-i18n="settings_style_color">Coloré</button>
          <button type="button" data-style="ios" data-i18n="settings_style_ios">Clair</button>
        </div>
      </div>

      <div class="settings-row">
        <label class="settings-label" data-i18n="settings_decimals">Décimales affichées</label>
        <div class="segmented" id="decimalsSegmented">
          <button type="button" data-decimals="2">2</button>
          <button type="button" data-decimals="3">3</button>
          <button type="button" data-decimals="4">4</button>
          <button type="button" data-decimals="5">5</button>
        </div>
      </div>

      <div class="settings-row">
        <label class="settings-label" data-i18n="settings_total">Bloc total des crédits</label>
        <div class="segmented" id="totalSegmented">
          <button type="button" data-total="off" data-i18n="settings_total_off">Désactivé</button>
          <button type="button" data-total="on" data-i18n="settings_total_on">Activé</button>
        </div>
      </div>
    </div>
  </div>

  <div class="confirm-backdrop" id="sortBackdrop" style="display:none;">
    <div class="confirm-box settings-box">
      <div class="settings-header">
        <p class="settings-title" data-i18n="sort_title">Trier par</p>
        <button type="button" id="sortCloseBtn" class="settings-close-btn" aria-label="Fermer">✕</button>
      </div>
      <div class="sort-options" id="sortOptions">
        <button type="button" class="sort-option" data-sort="dateAsc">
          <span data-i18n="sort_date_asc">Date (croissant)</span>
          <span class="sort-check">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><polyline points="20 6 9 17 4 12"></polyline></svg>
          </span>
        </button>
        <button type="button" class="sort-option" data-sort="dateDesc">
          <span data-i18n="sort_date_desc">Date (décroissant)</span>
          <span class="sort-check">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><polyline points="20 6 9 17 4 12"></polyline></svg>
          </span>
        </button>
        <button type="button" class="sort-option" data-sort="manual">
          <span data-i18n="sort_manual">Manuel</span>
          <span class="sort-check">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><polyline points="20 6 9 17 4 12"></polyline></svg>
          </span>
        </button>
      </div>
    </div>
  </div>

  <div class="confirm-backdrop" id="archiveChoiceBackdrop" style="display:none;">
    <div class="confirm-box settings-box">
      <div class="settings-header">
        <p class="settings-title" id="archiveChoiceTitle">—</p>
        <button type="button" id="archiveChoiceCloseBtn" class="settings-close-btn" aria-label="Fermer">✕</button>
      </div>
      <div class="sort-options">
        <button type="button" id="archiveChoiceArchiveBtn" class="sort-option">
          <span data-i18n="action_archive">Archiver</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="17" height="17"><rect x="3" y="4" width="18" height="5" rx="1"></rect><path d="M5 9v9a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V9"></path><line x1="10" y1="13" x2="14" y2="13"></line></svg>
        </button>
        <button type="button" id="archiveChoiceDeleteBtn" class="sort-option" style="color:var(--danger);">
          <span data-i18n="action_delete">Supprimer</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="17" height="17"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path><path d="M10 11v6"></path><path d="M14 11v6"></path><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"></path></svg>
        </button>
      </div>
    </div>
  </div>

  <div class="confirm-backdrop" id="totalFilterBackdrop" style="display:none;">
    <div class="confirm-box settings-box">
      <div class="settings-header">
        <p class="settings-title" data-i18n="total_filter_title">Filtrer le total</p>
        <button type="button" id="totalFilterCloseBtn" class="settings-close-btn" aria-label="Fermer">✕</button>
      </div>

      <div class="settings-row">
        <label class="settings-label" data-i18n="total_filter_from">Du</label>
        <div class="date-input-wrap">
          <input type="text" id="totalFromText" placeholder="JJ/MM/AAAA" inputmode="numeric" autocomplete="off">
          <div class="calendar-btn-wrap">
            <button type="button" class="calendar-btn" tabindex="-1" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18"><rect x="3" y="4" width="18" height="18" rx="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg></button>
            <input type="date" id="totalFromHidden" class="native-picker-overlay" aria-label="Choisir dans le calendrier">
          </div>
        </div>
      </div>

      <div class="settings-row">
        <label class="settings-label" data-i18n="total_filter_to">Au</label>
        <div class="date-input-wrap">
          <input type="text" id="totalToText" placeholder="JJ/MM/AAAA" inputmode="numeric" autocomplete="off">
          <div class="calendar-btn-wrap">
            <button type="button" class="calendar-btn" tabindex="-1" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18"><rect x="3" y="4" width="18" height="18" rx="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg></button>
            <input type="date" id="totalToHidden" class="native-picker-overlay" aria-label="Choisir dans le calendrier">
          </div>
        </div>
      </div>

  function loadSettings(){
    try{
      const raw = localStorage.getItem(SETTINGS_KEY);
      if(raw){
        const parsed = JSON.parse(raw);
        if(parsed.lang === 'fr' || parsed.lang === 'en') settings.lang = parsed.lang;
        if(parsed.style === 'color' || parsed.style === 'ios') settings.style = parsed.style;
        if(parsed.sortMode === 'dateAsc' || parsed.sortMode === 'dateDesc' || parsed.sortMode === 'manual') settings.sortMode = parsed.sortMode;
        if(typeof parsed.decimals === 'number' && parsed.decimals >= 2 && parsed.decimals <= 5) settings.decimals = parsed.decimals;
        if(typeof parsed.showTotal === 'boolean') settings.showTotal = parsed.showTotal;
        if(typeof parsed.totalFrom === 'string' || parsed.totalFrom === null) settings.totalFrom = parsed.totalFrom;
        if(typeof parsed.totalTo === 'string' || parsed.totalTo === null) settings.totalTo = parsed.totalTo;
        if(typeof parsed.totalIncludeArchived === 'boolean') settings.totalIncludeArchived = parsed.totalIncludeArchived;
      }
    }catch(e){}
  }

  function saveSettings(){
    try{ localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings)); }catch(e){}

  // ---- Verrouille le scroll de l'arrière-plan pendant qu'une fenêtre modale est ouverte ----
  let lockedScrollY = 0;
  let scrollLockCount = 0;
  function lockBodyScroll(){
    if(scrollLockCount === 0){
      lockedScrollY = window.scrollY;
      document.body.style.position = 'fixed';
      document.body.style.top = (-lockedScrollY) + 'px';
      document.body.style.left = '0';
      document.body.style.right = '0';
    }
    scrollLockCount++;
  }
  function unlockBodyScroll(){
    scrollLockCount = Math.max(0, scrollLockCount - 1);
    if(scrollLockCount === 0){
      document.body.style.position = '';
      document.body.style.top = '';
      document.body.style.left = '';
      document.body.style.right = '';
      window.scrollTo(0, lockedScrollY);
      updateScrollAvailability();
    }
  }

  // N'autorise le défilement de la page que si le contenu dépasse réellement l'écran.
  function updateScrollAvailability(){
    if(scrollLockCount > 0) return; // une fenêtre modale gère déjà le défilement
    const needsScroll = document.documentElement.scrollHeight > window.innerHeight + 1;
    document.documentElement.style.overflowY = needsScroll ? '' : 'hidden';
    document.body.style.overflowY = needsScroll ? '' : 'hidden';
  }
  window.addEventListener('resize', updateScrollAvailability);
  window.addEventListener('orientationchange', () => setTimeout(updateScrollAvailability, 150));

  function openForm(){
    formBackdrop.style.display = 'flex';
    lockBodyScroll();
  }

  function closeForm(){
    formBackdrop.style.display = 'none';
    unlockBodyScroll();
    form.reset();
    document.getElementById('initialDateField').style.display = 'none';
    setType('simple');
    formError.style.display = 'none';
    if(!editingId){
      selectedColorIndex = (selectedColorIndex + 1) % PALETTE.length;
      selectedIconIndex = (selectedIconIndex + 1) % ICONS_ALL.length;
    }
    editingId = null;
    submitBtn.textContent = t('btn_add');
    renderColorSwatches();
    renderIconSwatches();
  }

  function openEditForm(item){
    editingId = item.id;
    selectedColorIndex = typeof item.colorIndex === 'number' ? item.colorIndex : 0;
    renderColorSwatches();
    const iconIdx = item.icon ? ICONS_ALL.indexOf(item.icon) : -1;
    selectedIconIndex = iconIdx !== -1 ? iconIdx : 0;
    renderIconSwatches();
    document.getElementById('titleInput').value = item.title;

    if(item.type === 'simple'){
      setType('simple');
      const d = new Date(item.endDate);
      document.getElementById('endDateOnlyText').value = formatFRDate(d);
      document.getElementById('endTimeText').value = pad2(d.getHours()) + ':' + pad2(d.getMinutes());
    } else {
      setType('credit');
      document.getElementById('amountInput').value = item.amount;
      document.getElementById('initialAmountInput').value = (typeof item.initialAmount === 'number') ? item.initialAmount : '';
      document.getElementById('initialDateText').value = item.initialDate ? formatFRDate(new Date(item.initialDate)) : '';

      document.getElementById('rateInput').value = item.rate;
      document.getElementById('insuranceInput').value = item.insurance ? item.insurance : '';

  // ---- Saisie de date libre (JJ/MM/AAAA) + heure (HH:MM) + synchro avec le sélecteur caché ----
  function pad2(n){ return String(n).padStart(2, '0'); }

  function parseFRDate(str){
    const m = String(str).trim().match(/^(\d{1,2})[\/\.\-](\d{1,2})[\/\.\-](\d{4})$/);
    if(!m) return null;
    const day = +m[1], month = +m[2], year = +m[3];
    const d = new Date(year, month - 1, day);
    if(d.getFullYear() !== year || d.getMonth() !== month - 1 || d.getDate() !== day) return null;
    return d;
  }

  function parseFRTime(str){
    const m = String(str).trim().match(/^(\d{1,2}):(\d{2})$/);
    if(!m) return null;
    const hh = +m[1], mm = +m[2];
    if(hh > 23 || mm > 59) return null;
    return {hh, mm};
  }

  function formatFRDate(d){
    return pad2(d.getDate()) + '/' + pad2(d.getMonth() + 1) + '/' + d.getFullYear();
  }

  function formatFRTime(d){
    return pad2(d.getHours()) + ':' + pad2(d.getMinutes());
  }

  function applyDateMask(raw){
    const digits = String(raw).replace(/\D/g, '').slice(0, 8);
    let out = '';
    for(let i = 0; i < digits.length; i++){
      if(i === 2 || i === 4) out += '/';
      out += digits[i];
    }
    return out;
  }

  function applyTimeMask(raw){
    const digits = String(raw).replace(/\D/g, '').slice(0, 4);
    let out = '';
    for(let i = 0; i < digits.length; i++){
      if(i === 2) out += ':';
      out += digits[i];
    }
    return out;
  }

  // Même composant de saisie de date (texte masqué JJ/MM/AAAA + icône calendrier) partout
  function setupDatePicker(textId, hiddenId){
    const textEl = document.getElementById(textId);
    const hiddenEl = document.getElementById(hiddenId);

    hiddenEl.addEventListener('change', () => {
      if(!hiddenEl.value) return;
      const [y, m, day] = hiddenEl.value.split('-').map(Number);
      textEl.value = formatFRDate(new Date(y, m - 1, day));
      textEl.classList.remove('invalid');
    });

    textEl.addEventListener('input', () => {
      textEl.classList.remove('invalid');
      textEl.value = applyDateMask(textEl.value);
      const len = textEl.value.length;
      textEl.setSelectionRange(len, len);

      // Vérification immédiate dès que jour et mois sont saisis (sans attendre l'année)
      const digits = textEl.value.replace(/\D/g, '');
      if(digits.length >= 4){
        const day = parseInt(digits.slice(0, 2), 10);
        const month = parseInt(digits.slice(2, 4), 10);
        if(day < 1 || day > 31 || month < 1 || month > 12){
          textEl.classList.add('invalid');
        }
      }
    });
  }

  // Même principe pour l'heure (texte masqué HH:MM + icône horloge)

    });

  // ---- Form submit (création ou édition) ----
  form.addEventListener('submit', function(e){
    e.preventDefault();
    const title = document.getElementById('titleInput').value.trim();
    if(!title){ showError(t('err_title')); return; }

    let fields;

    if(currentType === 'simple'){
      const dateText = document.getElementById('endDateOnlyText');
      const timeText = document.getElementById('endTimeText');
      const datePart = parseFRDate(dateText.value);
      if(!datePart){
        dateText.classList.add('invalid');
        showError(t('err_end_date'));
        return;
      }
      const todayMidnight = new Date(); todayMidnight.setHours(0, 0, 0, 0);
      if(!editingId && datePart < todayMidnight){
        dateText.classList.add('invalid');
        showError(t('err_end_date_past'));
        return;
      }
      let hh = 0, mm = 0;
      if(timeText.value.trim() !== ''){
        const timePart = parseFRTime(timeText.value);
        if(!timePart){
          timeText.classList.add('invalid');
          showError(t('err_end_time'));
          return;
        }
        hh = timePart.hh; mm = timePart.mm;
      }
      const end = new Date(datePart.getFullYear(), datePart.getMonth(), datePart.getDate(), hh, mm);
      fields = {
        type: 'simple',
        title,
        colorIndex: selectedColorIndex,
        icon: ICONS_ALL[selectedIconIndex],
        endDate: end.toISOString()
      };
    } else {
      const amount = parseFloat(document.getElementById('amountInput').value);
      const rate = parseFloat(document.getElementById('rateInput').value);
      const insuranceRaw = document.getElementById('insuranceInput').value.trim();
      const insurance = insuranceRaw === '' ? 0 : parseFloat(insuranceRaw);
      const initialAmountRaw = document.getElementById('initialAmountInput').value.trim();
      const initialAmount = initialAmountRaw === '' ? null : parseFloat(initialAmountRaw);
      const startText = document.getElementById('startDateText');
      const endText = document.getElementById('creditEndDateText');
      const start = parseFRDate(startText.value);
      const end = parseFRDate(endText.value);

      if(!amount || amount <= 0 || isNaN(rate) || rate < 0 || !start || !end || isNaN(insurance) || insurance < 0 || (initialAmount !== null && (isNaN(initialAmount) || initialAmount < 0))){
        if(!start) startText.classList.add('invalid');
        if(!end) endText.classList.add('invalid');
        showError(t('err_credit_fields'));
        return;
      }
      if(end <= start){
        endText.classList.add('invalid');
        showError(t('err_end_after_start'));
        return;
      }
      if(initialAmount !== null && initialAmount < amount){
        document.getElementById('initialAmountInput').classList.add('invalid');
        showError(t('err_initial_amount'));
        return;
      }
      let initialDate = null;
      if(initialAmount !== null){
        const initialDateText = document.getElementById('initialDateText');
        const initialDatePart = parseFRDate(initialDateText.value);
        if(!initialDatePart){
          initialDateText.classList.add('invalid');
          showError(t('err_initial_date'));
          return;
        }
        if(initialDatePart >= start){
          initialDateText.classList.add('invalid');
          showError(t('err_initial_date_order'));
          return;
        }
        initialDate = initialDatePart.toISOString();
      }
      const endOfDay = new Date(end.getFullYear(), end.getMonth(), end.getDate(), 23, 59, 59);
      fields = {
        type: 'credit',
        title,
        amount,
        rate,
        insurance,
        initialAmount,
        initialDate,
        colorIndex: selectedColorIndex,
        icon: ICONS_ALL[selectedIconIndex],
        startDate: start.toISOString(),
        endDate: endOfDay.toISOString()
      };
    }

    if(editingId){
      const idx = items.findIndex(i => i.id === editingId);
      if(idx !== -1){
        items[idx] = Object.assign({id: items[idx].id, createdAt: items[idx].createdAt, order: items[idx].order}, fields);
      }
    } else {
      const maxOrder = items.reduce((m, i) => typeof i.order === 'number' ? Math.max(m, i.order) : m, -1);
      items.push(Object.assign({id: cryptoId(), createdAt: new Date().toISOString(), order: maxOrder + 1}, fields));
    }

    saveItems();
    render();
    closeForm();
  });

  const CARD_GAP = 14;

  function commitReorder(cardsEls, draggedEl, finalIndex){
    const orderedIds = cardsEls.map(el => el.getAttribute('data-id'));
    const draggedId = draggedEl.getAttribute('data-id');
    const fromIndex = orderedIds.indexOf(draggedId);
    if(fromIndex === -1) return;
    orderedIds.splice(fromIndex, 1);
    orderedIds.splice(Math.max(0, Math.min(finalIndex, orderedIds.length)), 0, draggedId);
    orderedIds.forEach((id, idx) => {
      const it = items.find(i => i.id === id);
      if(it) it.order = idx;
    });
    saveItems();
    if(settings.sortMode !== 'manual'){
      settings.sortMode = 'manual';
      saveSettings();
    }
  }

  function attachLongPress(cardEl, item){
    let timer = null;
    const LONG_PRESS_MS = 500;
    const MOVE_THRESHOLD = 6;

    let armed = false;
    let dragging = false;
    let startY = 0;
    let originalIndex = -1;
    let draggedStartCenter = 0;
    let slotHeight = 0;
    let siblings = []; // {el, origIndex, center}
    let cardsEls = [];
    let lastTargetIndex = -1;

    function getY(e){
      if(e.touches && e.touches.length) return e.touches[0].clientY;
      if(e.changedTouches && e.changedTouches.length) return e.changedTouches[0].clientY;
      return e.clientY;
    }

    function armLift(){
      armed = true;
      cardEl.classList.add('lift-armed');
      if(navigator.vibrate) navigator.vibrate(10);
      selectCard(cardEl, item);
    }

    function beginDrag(clientY){
      dragging = true;
      deselectCard();
      cardEl.classList.remove('lift-armed');
      cardEl.classList.add('dragging');
      cardsEls = Array.from(cardsGrid.querySelectorAll('.card'));
      originalIndex = cardsEls.indexOf(cardEl);
      lastTargetIndex = originalIndex;
      const rect = cardEl.getBoundingClientRect();
      draggedStartCenter = rect.top + rect.height / 2;
      slotHeight = rect.height + CARD_GAP;
      startY = clientY;
      siblings = cardsEls
        .map((el, idx) => ({el, idx}))
        .filter(s => s.el !== cardEl)
        .map(s => {
          const r = s.el.getBoundingClientRect();
          return {el: s.el, origIndex: s.idx, center: r.top + r.height / 2};
        });
      siblings.forEach(s => { s.el.style.transition = 'transform .18s ease'; });
    }

    function updateDrag(clientY){
      const deltaY = clientY - startY;
      cardEl.style.transform = 'translateY(' + deltaY + 'px)';
      const currentCenter = draggedStartCenter + deltaY;
      let targetIndex = 0;
      siblings.forEach(s => { if(s.center < currentCenter) targetIndex++; });
      targetIndex = Math.max(0, Math.min(targetIndex, cardsEls.length - 1));
      lastTargetIndex = targetIndex;

      siblings.forEach(s => {
        let shift = 0;
        if(originalIndex < targetIndex && s.origIndex > originalIndex && s.origIndex <= targetIndex){
          shift = -slotHeight;
        } else if(originalIndex > targetIndex && s.origIndex >= targetIndex && s.origIndex < originalIndex){
          shift = slotHeight;
        }
        s.el.style.transform = shift ? 'translateY(' + shift + 'px)' : '';
      });
    }

    function endDrag(){
      cardEl.classList.remove('dragging');
      cardEl.style.transform = '';
      siblings.forEach(s => { s.el.style.transform = ''; s.el.style.transition = ''; });
      if(lastTargetIndex !== -1 && lastTargetIndex !== originalIndex){
        commitReorder(cardsEls, cardEl, lastTargetIndex);
        render();
      }
      dragging = false;
      siblings = [];
      cardsEls = [];
    }

    function reset(){
      clearTimeout(timer);
      if(dragging){
        endDrag();
      } else if(armed){
        cardEl.classList.remove('lift-armed');
      }
      armed = false;
    }

    const onStart = (e) => {
      clearTimeout(timer);
      const y = getY(e);
      timer = setTimeout(() => {
        armLift();
      }, LONG_PRESS_MS);
      cardEl._dragStartY = y;
    };

    const onMove = (e) => {
      if(!armed){
        // Pas encore d'appui long confirmé : un mouvement annule la détection (scroll normal)
        clearTimeout(timer);
        return;
      }
      const y = getY(e);
      if(!dragging){
        if(Math.abs(y - cardEl._dragStartY) > MOVE_THRESHOLD){
          beginDrag(cardEl._dragStartY);
          updateDrag(y);
          if(e.cancelable) e.preventDefault();
        }
      } else {
        updateDrag(y);
        if(e.cancelable) e.preventDefault();
      }
    };

    const onEnd = () => { reset(); };

    cardEl.addEventListener('touchstart', onStart, {passive:true});
    cardEl.addEventListener('touchmove', onMove, {passive:false});
    cardEl.addEventListener('touchend', onEnd);
    cardEl.addEventListener('touchcancel', onEnd);
    cardEl.addEventListener('mousedown', onStart);
    cardEl.addEventListener('mousemove', onMove);
    cardEl.addEventListener('mouseup', onEnd);
    cardEl.addEventListener('mouseleave', () => { if(!armed) clearTimeout(timer); });
    cardEl.addEventListener('contextmenu', (e) => e.preventDefault());

    const editBtn = cardEl.querySelector('.edit-action');
    const deleteBtn = cardEl.querySelector('.delete-action');

    editBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      deselectCard();
      openEditForm(item);
    });

    deleteBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      deselectCard();
      openArchiveChoice(item);
    });
  }

  // ---- Duration math ----
  function splitDuration(ms){
    if(ms < 0) ms = 0;
    const totalSeconds = Math.floor(ms / 1000);
    const days = Math.floor(totalSeconds / 86400);
    const hours = Math.floor((totalSeconds % 86400) / 3600);
    const minutes = Math.floor((totalSeconds % 3600) / 60);
    const seconds = totalSeconds % 60;
    return {days, hours, minutes, seconds};
  }

  function pad(n, len){
    return String(n).padStart(len, '0');
  }

  // ---- Credit amortization (calé sur les échéances calendaires réelles) ----
  function addMonthsClamped(date, months){
    const d = new Date(date.getTime());
    const day = d.getDate();
    d.setDate(1);
    d.setMonth(d.getMonth() + months);
    const lastDayOfTarget = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
    d.setDate(Math.min(day, lastDayOfTarget));
    return d;
  }

  // Cache des échéanciers calculés par item (recalculé si dates/montant/taux changent)
  const scheduleCache = new Map();

  function buildSchedule(item){
    const cacheKey = item.id + '|' + item.amount + '|' + item.rate + '|' + item.startDate + '|' + item.endDate;
    const cached = scheduleCache.get(item.id);
    if(cached && cached.key === cacheKey) return cached;

    const start = new Date(item.startDate);
    const end = new Date(item.endDate);
    const startMs = start.getTime();
    const endMs = end.getTime();
    const amount = item.amount;
    const annualRate = item.rate;
    const avgMonthMs = 1000 * 60 * 60 * 24 * 30.4368;

    // Nombre de mensualités : nombre de mois calendaires réels entre le départ et la fin
    let n = Math.max(1, Math.round((endMs - startMs) / avgMonthMs));

    // Construit les dates d'échéance sur le même quantième que la date de départ,
    // comme dans un vrai échéancier bancaire (ex. le 07 de chaque mois).
    let boundaries = [startMs];
    for(let k = 1; k < n; k++){
      boundaries.push(addMonthsClamped(start, k).getTime());
    }
    boundaries.push(endMs);

    // Si l'estimation du nombre de mois était trop haute (dernier palier calendaire
    // dépasse déjà la date de fin), on retire les paliers en trop.
    while(boundaries.length > 2 && boundaries[boundaries.length - 2] >= endMs){
      boundaries.splice(boundaries.length - 2, 1);
      n = boundaries.length - 1;
    }

    const r = (annualRate / 100) / 12;
    let monthly;
    if(r > 0){
      monthly = amount * r / (1 - Math.pow(1 + r, -n));
    } else {
      monthly = amount / n;
    }

    function balanceAt(k){
      if(k <= 0) return amount;
      if(k >= n) return 0;
      if(r > 0){
        const b = amount * Math.pow(1 + r, k) - monthly * ((Math.pow(1 + r, k) - 1) / r);
        return Math.max(0, b);
      } else {
        return Math.max(0, amount - k * monthly);
      }
    }

    const balances = [];
    for(let k = 0; k <= n; k++) balances.push(balanceAt(k));

    const totalInterest = Math.max(0, monthly * n - amount);

    const schedule = {key: cacheKey, n, boundaries, balances, monthly, totalInterest, startMs, endMs};
    scheduleCache.set(item.id, schedule);
    return schedule;
  }

  function creditState(item, now){
    const amount = item.amount;
    // Montant initial : sert uniquement à calculer la barre de progression.
    // Utile en cas de renégociation (le montant emprunté actuel diffère du montant d'origine).
    const baseAmount = (typeof item.initialAmount === 'number' && item.initialAmount > 0) ? item.initialAmount : amount;
    const schedule = buildSchedule(item);
    const {n, boundaries, balances, monthly, totalInterest, startMs, endMs} = schedule;

    function progressFor(remainingVal){
      if(baseAmount <= 0) return 0;
      return Math.min(1, Math.max(0, (baseAmount - remainingVal) / baseAmount));
    }

    if(now <= startMs){
      return {remaining: amount, progress: progressFor(amount), notStarted: true, finished:false, monthly, interestPaid: 0, totalInterest};
    }
    if(now >= endMs){
      return {remaining: 0, progress: progressFor(0), notStarted:false, finished:true, monthly, interestPaid: totalInterest, totalInterest};
    }

    // Recherche du palier mensuel courant
    let k = 0;
    while(k < n - 1 && boundaries[k + 1] <= now) k++;
    const segStart = boundaries[k];
    const segEnd = boundaries[k + 1];
    const frac = segEnd > segStart ? (now - segStart) / (segEnd - segStart) : 0;
    const remaining = Math.max(0, balances[k] + (balances[k + 1] - balances[k]) * frac);
    const progress = progressFor(remaining);

    const totalPaidSoFar = monthly * (k + frac);
    const principalPaidSoFar = amount - remaining;
    const interestPaid = Math.min(totalInterest, Math.max(0, totalPaidSoFar - principalPaidSoFar));

    return {remaining, progress, notStarted:false, finished:false, monthly, interestPaid, totalInterest};
  }

  let cachedCreditItems = [];
  function recomputeCreditItemsList(){
    const rangeStart = settings.totalFrom ? new Date(settings.totalFrom).getTime() : -Infinity;
    const rangeEnd = settings.totalTo ? new Date(settings.totalTo).getTime() : Infinity;
    cachedCreditItems = items.filter(i => {

      if(i.archived && !settings.totalIncludeArchived) return false;
      const itemStart = new Date(i.startDate).getTime();

  // Liste déjà filtrée, mise à jour uniquement quand les données changent (render()) —

  function creditItemsList(){

  function updateTotalCard(){
    if(!settings.showTotal) return;
    const creditItems = creditItemsList();
    if(creditItems.length === 0) return;
    const now = Date.now();
    let remainingSum = 0, baseSum = 0, monthlySum = 0;
    creditItems.forEach(item => {
      const startMs = new Date(item.startDate).getTime();
      const hasHistory = item.initialDate && typeof item.initialAmount === 'number';
      const active = now >= startMs || hasHistory;
      remainingSum += remainingWithHistory(item, now);
      if(active){
        const state = creditState(item, now);
        const base = (typeof item.initialAmount === 'number' && item.initialAmount > 0) ? item.initialAmount : item.amount;
        baseSum += base;
        monthlySum += state.monthly + (item.insurance || 0);
      }
    });
    const progress = baseSum > 0 ? Math.min(1, Math.max(0, (baseSum - remainingSum) / baseSum)) : 0;
    totalAmountEl.textContent = formatMoney(remainingSum) + ' €';
    totalProgressEl.style.width = (progress * 100) + '%';
    totalMonthlyEl.textContent = t('total_monthly') + ' : ' + monthlyFormatter.format(monthlySum) + ' €';
  }

  // Reconstitue le capital restant dû en tenant compte, le cas échéant, de la période
  // antérieure à une renégociation (montant initial + date du montant initial).
  function remainingWithHistory(item, t){
    const startMs = new Date(item.startDate).getTime();
    if(item.initialDate && typeof item.initialAmount === 'number'){
      const initMs = new Date(item.initialDate).getTime();
      if(t < initMs){
        // Avant même la date du montant initial, ce crédit (et son historique)
        // n'existe pas encore : il ne doit pas compter dans le total.
        return 0;
      }
      if(t < startMs && startMs > initMs){
        const frac = (t - initMs) / (startMs - initMs);
        return item.initialAmount + (item.amount - item.initialAmount) * frac;
      }
      if(t < startMs) return item.initialAmount;
    } else if(t < startMs){
      // Pas d'historique renseigné : avant la date de départ, ce crédit n'existe
      // pas encore et ne doit pas compter dans le total (saut net à son démarrage).
      return 0;
    }
    return creditState(item, t).remaining;
  }

  function generateTotalChartSVG(creditItems){
    if(creditItems.length === 0) return '';
    const initialDatesMs = creditItems.filter(i => i.initialDate).map(i => new Date(i.initialDate).getTime());
    const startDatesMs = creditItems.map(i => new Date(i.startDate).getTime());
    const ends = creditItems.map(i => new Date(i.endDate).getTime());
    const minStart = initialDatesMs.length > 0 ? Math.min(...initialDatesMs) : Math.min(...startDatesMs);
    const maxEnd = Math.max(...ends);
    if(maxEnd <= minStart) return '';

    const W = 300, H = 76, padL = 4, padR = 4, padT = 16, padB = 16;
    const plotW = W - padL - padR;
    const plotH = H - padT - padB;
    const POINTS = 36;

    const samples = [];
    for(let i = 0; i <= POINTS; i++){
      const tms = minStart + (maxEnd - minStart) * (i / POINTS);
      let sum = 0;
      creditItems.forEach(item => { sum += remainingWithHistory(item, tms); });
      samples.push({tms, val: sum});
    }
    const maxVal = Math.max(...samples.map(s => s.val), 1);

    function xFor(tms){ return padL + ((tms - minStart) / (maxEnd - minStart)) * plotW; }
    function yFor(val){ return padT + (1 - (val / maxVal)) * plotH; }

    let pathD = '';
    samples.forEach((s, i) => {
      pathD += (i === 0 ? 'M' : 'L') + xFor(s.tms).toFixed(1) + ',' + yFor(s.val).toFixed(1) + ' ';
    });

    const now = Date.now();
    let marker = '';
    if(now >= minStart && now <= maxEnd){
      let nowSum = 0;
      creditItems.forEach(item => { nowSum += remainingWithHistory(item, now); });
      const mx = xFor(now).toFixed(1);
      const my = yFor(nowSum).toFixed(1);
      marker = '<line x1="' + mx + '" y1="' + padT + '" x2="' + mx + '" y2="' + (padT + plotH) + '" stroke="currentColor" stroke-opacity="0.35" stroke-width="1" stroke-dasharray="2,2"></line>' +
               '<circle cx="' + mx + '" cy="' + my + '" r="2.8" fill="currentColor"></circle>';
    }

    const baseline = '<line x1="' + padL + '" y1="' + (padT + plotH) + '" x2="' + (padL + plotW) + '" y2="' + (padT + plotH) + '" stroke="currentColor" stroke-opacity="0.3" stroke-width="1"></line>';
    const maxLabel = (maxVal / 1000).toFixed(0) + ' K€';

    // Petit repère vertical sur l'axe à la date de départ ET de fin de chaque échéance
    let echeanceTicks = '';
    creditItems.forEach(item => {
      [new Date(item.startDate).getTime(), new Date(item.endDate).getTime()].forEach(ms => {
        if(ms < minStart || ms > maxEnd) return;
        const ex = xFor(ms).toFixed(1);
        echeanceTicks += '<line x1="' + ex + '" y1="' + (padT + plotH - 4) + '" x2="' + ex + '" y2="' + (padT + plotH + 4) + '" stroke="currentColor" stroke-opacity="0.55" stroke-width="1.5"></line>';
      });
    });

    return '<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none">' +
      baseline +
      '<text x="' + padL + '" y="10" font-size="8" fill="currentColor" fill-opacity="0.7">' + maxLabel + '</text>' +
      '<path d="' + pathD.trim() + '" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>' +
      echeanceTicks +
      marker +
    '</svg>';
  }

  function renderTotalCard(){
    const creditItems = creditItemsList();
    if(!settings.showTotal || creditItems.length === 0){
      totalCardEl.style.display = 'none';
      return;
    }
    totalCardEl.style.display = 'block';
    totalChartEl.innerHTML = generateTotalChartSVG(creditItems);

    const initialDatesMs = creditItems.filter(i => i.initialDate).map(i => new Date(i.initialDate).getTime());
    const startDatesMs = creditItems.map(i => new Date(i.startDate).getTime());
    const ends = creditItems.map(i => new Date(i.endDate).getTime());
    const minStart = initialDatesMs.length > 0 ? Math.min(...initialDatesMs) : Math.min(...startDatesMs);
    const maxEnd = Math.max(...ends);
    const span = maxEnd - minStart;

    if(span > 0){
      const seenMs = new Set();
      const markers = [];
      creditItems.forEach(item => {
        [new Date(item.startDate).getTime(), new Date(item.endDate).getTime()].forEach(ms => {
          if(ms < minStart || ms > maxEnd) return;
          if(seenMs.has(ms)) return;
          seenMs.add(ms);
          markers.push(ms);
        });
      });
      markers.sort((a, b) => a - b);

      // Si deux dates sont trop proches pour tenir côte à côte, on les répartit
      // sur des lignes alternées plutôt que de les laisser se chevaucher.
      const MIN_GAP_PCT = 11;
      const rowLastPct = [-Infinity, -Infinity, -Infinity];
      const placed = markers.map(ms => {
        const pct = Math.min(100, Math.max(0, ((ms - minStart) / span) * 100));
        let row = rowLastPct.length - 1;
        for(let r = 0; r < rowLastPct.length; r++){
          if(pct - rowLastPct[r] >= MIN_GAP_PCT){ row = r; break; }
        }
        rowLastPct[row] = pct;
        return {ms, pct, row};
      });
      const rowCount = Math.max(1, ...placed.map(p => p.row + 1));
      totalChartDatesEl.style.height = (rowCount * 13 + 1) + 'px';
      totalChartDatesEl.innerHTML = placed.map(p =>
        '<span style="left:' + p.pct.toFixed(2) + '%; top:' + (p.row * 13) + 'px;">' + formatShortDate(p.ms) + '</span>'
      ).join('');
    } else {
      totalChartDatesEl.innerHTML = '';
    }

    updateTotalCard();
  }
