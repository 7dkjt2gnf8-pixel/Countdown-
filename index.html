  // Réduit la taille de police d'un titre trop long pour qu'il tienne sur une
  // seule ligne sans déformer la vignette (l'ellipse CSS reste le filet de sécurité).
  function fitCardTitle(el){
    const min = 12;
    const base = parseFloat(getComputedStyle(el).fontSize);
    el.style.fontSize = '';
    if(el.scrollWidth <= el.clientWidth + 1) return;
    let size = base;
    while(el.scrollWidth > el.clientWidth && size > min){
      size -= 1;
      el.style.fontSize = size + 'px';
    }
  }

  function escapeHtml(s){
    const div = document.createElement('div');
    div.textContent = s;
    return div.innerHTML;
  }

  function formatDate(iso){
    const d = new Date(iso);
    const locale = settings.lang === 'en' ? 'en-GB' : 'fr-FR';
    let s = d.toLocaleDateString(locale, {weekday:'short', day:'numeric', month:'short', year:'numeric'});
    return s.charAt(0).toUpperCase() + s.slice(1);
  }


  // ---- Tick loop ----
  function diffYMD(from, to){
    let years = to.getFullYear() - from.getFullYear();
    let months = to.getMonth() - from.getMonth();
    let days = to.getDate() - from.getDate();
    if(days < 0){
      months -= 1;
      const prevMonthLastDay = new Date(to.getFullYear(), to.getMonth(), 0).getDate();
      days += prevMonthLastDay;
    }
    if(months < 0){
      years -= 1;
      months += 12;
    }
    return {years, months, days};
  }

  function formatYMD(y, m, d, hh, mm, ss){
    const yearLine = y > 0 ? (y + ' ' + (y > 1 ? t('ymd_years') : t('ymd_year')) + '<br>') : '';
    return yearLine + m + ' ' + t('ymd_months') + '<br>' + d + ' ' + t('ymd_days') + '<br>' + pad(hh,2) + ':' + pad(mm,2) + ':' + pad(ss,2);
  }

  function tick(){
    const now = Date.now();
    updateTotalCard();
    tickTargets.forEach(target => {
      const card = target.card;
      const item = target.item;
      const valueEl = target.valueEl;
      const subEl = target.subEl;
      const ymdEl = target.ymdEl;
      const numberEl = target.numberEl;
      const isYMD = numberEl.classList.contains('mode-ymd');

      if(item.type === 'simple'){
        const end = new Date(item.endDate).getTime();
        const remainingMs = end - now;
        const {days, hours, minutes, seconds} = splitDuration(remainingMs);
        if(remainingMs <= 0){
          const doneLabel = t('status_done') + ' ' + t('status_on') + ' ' + formatFRDate(new Date(end));
          valueEl.textContent = '0';
          subEl.textContent = doneLabel;
          ymdEl.textContent = doneLabel;
        } else {
          valueEl.textContent = days;
          subEl.textContent = pad(hours,2) + ':' + pad(minutes,2) + ':' + pad(seconds,2);
          if(isYMD){
            const ymd = diffYMD(new Date(now), new Date(end));
            ymdEl.innerHTML = formatYMD(ymd.years, ymd.months, ymd.days, hours, minutes, seconds);
          }
        }
      } else {
        const end = new Date(item.endDate).getTime();
        const remainingMs = end - now;
        const {days, hours, minutes, seconds} = splitDuration(remainingMs);
        if(remainingMs <= 0){
          const paidOffLabel = t('status_paid_off') + ' ' + t('status_on') + ' ' + formatFRDate(new Date(end));
          valueEl.textContent = '0';
          subEl.textContent = paidOffLabel;
          ymdEl.textContent = paidOffLabel;
        } else {
          valueEl.textContent = days;
          subEl.textContent = pad(hours,2) + ':' + pad(minutes,2) + ':' + pad(seconds,2);
          if(isYMD){
            const ymd = diffYMD(new Date(now), new Date(end));
            ymdEl.innerHTML = formatYMD(ymd.years, ymd.months, ymd.days, hours, minutes, seconds);
          }
        }

        const state = creditState(item, now);
        const progressEl = target.progressEl;
        const progressPercentEl = target.progressPercentEl;
        const moneyEl = target.moneyEl;
        const captionEl = target.captionEl;
        const repaidTodayEl = target.repaidTodayEl;
        const repaidMonthEl = target.repaidMonthEl;
        const interestMonthEl = target.interestMonthEl;
        progressEl.style.width = (state.progress * 100) + '%';
        progressPercentEl.textContent = (state.progress * 100).toFixed(1) + '%';
        if(state.notStarted){
          moneyEl.textContent = formatMoney(item.amount) + ' €';
          captionEl.textContent = formatMensualite(item, state.monthly);
          repaidTodayEl.textContent = '';
          repaidMonthEl.textContent = '';
          interestMonthEl.textContent = '';
        } else if(state.finished){
          moneyEl.textContent = formatMoney(0) + ' €';
          captionEl.textContent = formatMensualite(item, state.monthly);
          repaidTodayEl.textContent = '';
          repaidMonthEl.textContent = '';
          interestMonthEl.textContent = '';
        } else {
          moneyEl.textContent = formatMoney(state.remaining) + ' €';
          captionEl.textContent = formatMensualite(item, state.monthly);
          const startOfToday = new Date(now);
          startOfToday.setHours(0, 0, 0, 0);
          const startOfTomorrow = new Date(startOfToday.getFullYear(), startOfToday.getMonth(), startOfToday.getDate() + 1).getTime();
          const stateStartOfDay = creditState(item, startOfToday.getTime());
          const stateEndOfDay = creditState(item, startOfTomorrow);
          const repaidToday = Math.max(0, stateStartOfDay.remaining - state.remaining);
          const totalToday = Math.max(0, stateStartOfDay.remaining - stateEndOfDay.remaining);
          repaidTodayEl.textContent = t('repaid_today') + ' : ' + formatMoney(repaidToday) + ' € / ' + eurFormatter.format(totalToday) + '€';

          const startOfMonth = new Date(startOfToday.getFullYear(), startOfToday.getMonth(), 1).getTime();
          const startOfNextMonth = new Date(startOfToday.getFullYear(), startOfToday.getMonth() + 1, 1).getTime();
          const stateStartOfMonth = creditState(item, startOfMonth);
          const stateEndOfMonth = creditState(item, startOfNextMonth);
          const repaidMonth = Math.max(0, stateStartOfMonth.remaining - state.remaining);
          const totalMonth = Math.max(0, stateStartOfMonth.remaining - stateEndOfMonth.remaining);
          repaidMonthEl.textContent = t('repaid_month') + ' : ' + threeDecFormatter.format(repaidMonth) + '€/' + eurFormatter.format(totalMonth) + '€';

          const totalInterestMonth = Math.max(0, state.monthly - totalMonth);
          const fractionElapsed = startOfNextMonth > startOfMonth ? (now - startOfMonth) / (startOfNextMonth - startOfMonth) : 0;
          const totalPaidSoFarMonth = state.monthly * Math.min(1, Math.max(0, fractionElapsed));
          const interestMonth = Math.min(totalInterestMonth, Math.max(0, totalPaidSoFarMonth - repaidMonth));
          interestMonthEl.textContent = t('interest_month') + ' : ' + threeDecFormatter.format(interestMonth) + '€/' + eurFormatter.format(totalInterestMonth) + '€';
        }
      }
    });
  }

  // ---- Panneau de réglages ----
  const settingsBtn = document.getElementById('settingsBtn');
  const settingsBackdrop = document.getElementById('settingsBackdrop');
  const settingsCloseBtn = document.getElementById('settingsCloseBtn');
  const langSegmented = document.getElementById('langSegmented');
  const styleSegmented = document.getElementById('styleSegmented');
  const decimalsSegmented = document.getElementById('decimalsSegmented');
  const totalSegmented = document.getElementById('totalSegmented');

  function refreshSettingsUI(){
    langSegmented.querySelectorAll('button').forEach(btn => {
      btn.classList.toggle('active', btn.getAttribute('data-lang') === settings.lang);
    });
    styleSegmented.querySelectorAll('button').forEach(btn => {
      btn.classList.toggle('active', btn.getAttribute('data-style') === settings.style);
    });
    decimalsSegmented.querySelectorAll('button').forEach(btn => {
      btn.classList.toggle('active', parseInt(btn.getAttribute('data-decimals'), 10) === settings.decimals);
    });
    totalSegmented.querySelectorAll('button').forEach(btn => {
      btn.classList.toggle('active', (btn.getAttribute('data-total') === 'on') === settings.showTotal);
    });
  }

  settingsBtn.addEventListener('click', () => {
    refreshSettingsUI();
    settingsBackdrop.style.display = 'flex';
    lockBodyScroll();
  });
  settingsCloseBtn.addEventListener('click', () => { settingsBackdrop.style.display = 'none'; unlockBodyScroll(); });
  settingsBackdrop.addEventListener('click', (e) => {
    if(e.target === settingsBackdrop){ settingsBackdrop.style.display = 'none'; unlockBodyScroll(); }
  });

  langSegmented.querySelectorAll('button').forEach(btn => {
    btn.addEventListener('click', () => {
      settings.lang = btn.getAttribute('data-lang');
      saveSettings();
      refreshSettingsUI();
      applyTranslations();
    });
  });
  styleSegmented.querySelectorAll('button').forEach(btn => {
    btn.addEventListener('click', () => {
      settings.style = btn.getAttribute('data-style');
      saveSettings();
      refreshSettingsUI();
      applyStyle();
    });
  });
  decimalsSegmented.querySelectorAll('button').forEach(btn => {
    btn.addEventListener('click', () => {
      settings.decimals = parseInt(btn.getAttribute('data-decimals'), 10);
      saveSettings();
      refreshSettingsUI();
      tick();
    });
  });
  totalSegmented.querySelectorAll('button').forEach(btn => {
    btn.addEventListener('click', () => {
      settings.showTotal = btn.getAttribute('data-total') === 'on';
      saveSettings();
      refreshSettingsUI();
      render();
    });
  });

  // ---- Menu de tri ----
  const sortBtn = document.getElementById('sortBtn');
  const sortBackdrop = document.getElementById('sortBackdrop');
  const sortCloseBtn = document.getElementById('sortCloseBtn');
  const sortOptions = document.getElementById('sortOptions');

  function refreshSortUI(){
    sortOptions.querySelectorAll('.sort-option').forEach(btn => {
      btn.classList.toggle('active', btn.getAttribute('data-sort') === settings.sortMode);
    });
  }

  function closeSortMenu(){
    sortBackdrop.style.display = 'none';
    unlockBodyScroll();
  }

  sortBtn.addEventListener('click', () => {
    refreshSortUI();
    sortBackdrop.style.display = 'flex';
    lockBodyScroll();
  });
  sortCloseBtn.addEventListener('click', closeSortMenu);
  sortBackdrop.addEventListener('click', (e) => {
    if(e.target === sortBackdrop) closeSortMenu();
  });

  sortOptions.querySelectorAll('.sort-option').forEach(btn => {
    btn.addEventListener('click', () => {
      settings.sortMode = btn.getAttribute('data-sort');
      saveSettings();
      refreshSortUI();
      closeSortMenu();
      render();
    });
  });

  loadSettings();
  applyStyle();
  setType('simple');
  applyTranslations();
  loadItems();

  // Boucle de mise à jour calée sur le taux de rafraîchissement de l'écran (plus fluide
  // qu'un setInterval à intervalle fixe, et automatiquement mise en pause en arrière-plan).
  function animationLoop(){
    tick();
    requestAnimationFrame(animationLoop);
  }
  requestAnimationFrame(animationLoop);
})();
</script>
</body>
</html>
